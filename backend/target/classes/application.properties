spring.datasource.url=jdbc:mysql://localhost:3306/agromart_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Dhivakar@2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ================= JWT CONFIG =================
agromart.jwt.secret=AgromartSecretKeyAgromartSecretKey123456
agromart.jwt.expiration=86400000



server.port=8081
app.frontend-url=http://localhost:5173

# File Upload Configuration
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Actuator / Metrics
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
